<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ đồ chỗ ngồi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .stage { width: 300px; height: 40px; background: #34495e; color: white; display: flex; align-items: center; justify-content: center; margin-bottom: 50px; border-radius: 0 0 50px 50px; font-weight: bold; }
        .seat { cursor: pointer; transition: all 0.2s; }
        .seat:hover { opacity: 0.8; transform: scale(1.1); }
        .available { fill: #2ecc71; }
        .booked { fill: #e74c3c; cursor: not-allowed; }
        .holding { fill: #9b59b6; cursor: wait; } /* Màu tím cho ghế đang giữ */
        .selected { fill: #f1c40f; stroke: #d35400; stroke-width: 2; }
        #info-panel { margin-top: 30px; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-width: 300px; text-align: center; }
        button { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        button:hover { background: #2980b9; }
        .legend { display: flex; gap: 20px; margin-bottom: 20px; }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 14px; }
        .box { width: 15px; height: 15px; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>SƠ ĐỒ CHỖ NGỒI SỰ KIỆN</h1>
    
    <div class="stage">SÂN KHẤU</div>

    <div class="legend">
        <div class="legend-item"><div class="box available"></div> Trống</div>
        <div class="legend-item"><div class="box booked"></div> Đã bán</div>
        <div class="legend-item"><div class="box holding"></div> Đang giữ chỗ</div>
        <div class="legend-item"><div class="box selected"></div> Đang chọn</div>
    </div>

    <svg id="seat-map" width="400" height="250"></svg>

    <div id="info-panel">
        <p id="instruction">Vui lòng chọn một ghế để xem thông tin</p>
        <div id="details" style="display: none;">
            <p><b>Vị trí:</b> <span id="seat-id"></span></p>
            <p><b>Giá vé:</b> <span id="seat-price"></span> VNĐ</p>
            <button id="btn-book">XÁC NHẬN ĐẶT VÉ</button>
        </div>
    </div>

    <script>
        const svg = document.getElementById('seat-map');
        const infoPanel = document.getElementById('details');
        const instruction = document.getElementById('instruction');
        let currentSelectedId = null;

        async function fetchSeats() {
            const res = await fetch('/api/seats');
            const seats = await res.json();
            renderMap(seats);
        }

        function renderMap(seats) {
            svg.innerHTML = '';
            let maxRow = 0, maxCol = 0;
            for (const key in seats) {
                const [row, col] = key.split('-').map(Number);
                if (row > maxRow) maxRow = row;
                if (col > maxCol) maxCol = col;
            }
            svg.setAttribute("width", (maxCol + 1) * 45); 
            svg.setAttribute("height", (maxRow + 1) * 40);

            for (const key in seats) {
                const seat = seats[key];
                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                
                rect.setAttribute("x", seat.col * 45);
                rect.setAttribute("y", seat.row * 40);
                rect.setAttribute("width", 35);
                rect.setAttribute("height", 35);
                rect.setAttribute("rx", 8);
                rect.dataset.id = seat.id;
                rect.dataset.price = seat.price;
                
                rect.classList.add('seat');
                if (seat.status === 1) rect.classList.add('booked');
                else if (seat.status === 2) rect.classList.add('holding');
                else rect.classList.add('available');
                
                rect.onclick = () => {
                    if (seat.status !== 0) return; // Chỉ cho phép chọn ghế trống
                    
                    document.querySelectorAll('.seat').forEach(s => s.classList.remove('selected'));
                    rect.classList.add('selected');
                    
                    currentSelectedId = seat.id;
                    instruction.style.display = 'none';
                    infoPanel.style.display = 'block';
                    document.getElementById('seat-id').innerText = `Hàng ${seat.row} - Ghế ${seat.col}`;
                    document.getElementById('seat-price').innerText = seat.price.toLocaleString();
                };

                svg.appendChild(rect);
            }
        }

        document.getElementById('btn-book').onclick = async () => {
            if (!currentSelectedId) return;

            // Bước 1: Giữ chỗ (Hold)
            const holdRes = await fetch('/api/hold', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ seat_id: currentSelectedId })
            });
            const holdData = await holdRes.json();
            
            if (!holdData.success) {
                alert(holdData.message);
                fetchSeats();
                return;
            }

            // Bước 2: Mô phỏng thanh toán và xác nhận đặt (Book)
            if (confirm(holdData.message + "\nNhấn OK để thanh toán ngay.")) {
                const bookRes = await fetch('/api/book', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ seat_id: currentSelectedId })
                });
                const bookData = await bookRes.json();
                alert(bookData.message);
            } else {
                // Nếu người dùng không thanh toán, ghế sẽ tự động nhả sau 5 phút
                alert("Bạn đã hủy thanh toán. Ghế sẽ được giải phóng sau ít phút.");
            }
            
            infoPanel.style.display = 'none';
            instruction.style.display = 'block';
            fetchSeats(); // Cập nhật lại trạng thái ghế
        };

        fetchSeats();
    </script>
</body>
</html>
