<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán vé</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            margin: 0;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .payment-container {
            background: white;
            max-width: 500px;
            width: 100%;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 1.8rem;
        }

        .info-box {
            background: #e8f5e9;
            border-left: 5px solid #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: left;
            color: #2e7d32;
        }

        .amount-box {
            margin: 20px 0;
        }

            .amount-box p {
                color: #7f8c8d;
                margin: 0 0 5px 0;
                font-size: 1rem;
            }

        .amount {
            color: #e74c3c;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0;
            letter-spacing: 1px;
        }

        .qr-wrapper {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 25px;
            border: 2px dashed #bdc3c7;
        }

            .qr-wrapper img {
                width: 250px;
                border-radius: 10px;
                mix-blend-mode: multiply;
            }

        .btn-confirm {
            background: #16a085;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(22, 160, 133, 0.3);
        }

            .btn-confirm:hover {
                background: #12876f;
                transform: translateY(-2px);
            }

        .btn-back {
            display: block;
            margin-top: 15px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

            .btn-back:hover {
                color: #e74c3c;
            }
    </style>
</head>
<body>

    <div class="payment-container">
        <h2>Quét mã để thanh toán</h2>

        <div class="info-box">
            <strong style="font-size: 1.1rem;">🎟️ Thông tin nhận vé:</strong><br>
            <div style="margin-top: 8px;">
                👤 Họ tên: <strong>{{ buyer_info.fullname }}</strong><br>
                ✉️ Email: <strong style="text-decoration: underline;">{{ buyer_info.email }}</strong>
            </div>
            <small style="display: block; margin-top: 8px; opacity: 0.8;">* Vé điện tử sẽ được gửi về địa chỉ Email này.</small>
        </div>

        <div class="amount-box">
            <p>Tổng số tiền cần thanh toán</p>
            <div class="amount">{{ amount | format }}đ</div>
        </div>

        <div class="qr-wrapper">
            <img src="{{ qr_url }}" alt="Mã QR Thanh toán">
            <p style="color: #7f8c8d; margin-top: 15px; font-size: 0.9rem; margin-bottom: 0;">Mở ứng dụng ngân hàng để quét mã</p>
        </div>

        <form action="/api/confirm_payment" method="POST">
            <button type="submit" class="btn-confirm">✅ Tôi đã thanh toán thành công</button>
        </form>

        <a href="/checkout_info" class="btn-back">← Sửa lại thông tin nhận vé</a>
    </div>

</body>
</html>
