<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mua vé - {{ event.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Mua vé: {{ event.name }}</h2>
                        <p><strong>Địa điểm:</strong> {{ event.location }}</p>
                        <p><strong>Ngày:</strong> {{ event.event_date or 'Chưa cập nhật' }}</p>
                        <p><strong>Khách mời:</strong> {{ event.guest_list or 'Đang cập nhật' }}</p>
                        <hr>
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Chọn hạng vé:</label>
                                <select name="ticket_class" class="form-select">
                                    <option value="Standard">Standard (Gốc: {{ event.price }} VNĐ)</option>
                                    <option value="VIP">VIP (x1.5)</option>
                                    <option value="VVIP">VVIP (x2.5)</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Xác nhận mua</button>
                            <a href="{{ url_for('index') }}" class="btn btn-secondary w-100 mt-2">Quay lại</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
